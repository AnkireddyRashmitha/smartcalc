<!-- converter.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unit Converter</title>

<style>

body{
font-family:Poppins,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
border-radius:20px;
width:350px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

select,
input,
button{
width:100%;
padding:14px;
margin-top:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
background:#2979ff;
color:white;
border:none;
cursor:pointer;
font-weight:600;
}

button:hover{
background:#005ce6;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:600;
text-align:center;
}

</style>
</head>

<body>

<div class="box">

<h1>Unit Converter</h1>

<select id="type">

<option value="length">
Length (Meter → CM)
</option>

<option value="weight">
Weight (KG → Gram)
</option>

<option value="temp">
Temperature (Celsius → Fahrenheit)
</option>

</select>

<input type="number" id="value" placeholder="Enter value">

<button onclick="convert()">
Convert
</button>

<div id="result"></div>

</div>

<script>

function convert(){

let type=document.getElementById("type").value;

let value=parseFloat(document.getElementById("value").value);

let result="";

if(type=="length"){

result=(value*100)+" cm";

}

else if(type=="weight"){

result=(value*1000)+" grams";

}

else if(type=="temp"){

result=((value*9/5)+32).toFixed(2)+" °F";

}

document.getElementById("result").innerHTML=result;

}

</script>

</body>
</html>
