<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="padding:40px 20px;">

<h1 class="section-title">💰 Compound Interest Calculator</h1>
<p class="section-sub">Calculate compound interest instantly</p>

<br><br>

<div class="calc-panel">

<div class="form-group">
<label>Principal Amount</label>
<input type="number" id="principal" placeholder="Enter amount">
</div>

<div class="form-group">
<label>Interest Rate (%)</label>
<input type="number" id="rate" placeholder="Enter interest rate">
</div>

<div class="form-group">
<label>Time (Years)</label>
<input type="number" id="time" placeholder="Enter years">
</div>

<button class="btn-calc" onclick="calculateCompound()">
Calculate
</button>

<br><br>

<div id="result" style="font-size:20px;font-weight:bold;"></div>

</div>

</div>

<script>

function calculateCompound() {

let p = parseFloat(document.getElementById("principal").value);

let r = parseFloat(document.getElementById("rate").value);

let t = parseFloat(document.getElementById("time").value);

if(isNaN(p) || isNaN(r) || isNaN(t)) {

alert("Please fill all fields");

return;

}

let amount = p * Math.pow((1 + r / 100), t);

let interest = amount - p;

document.getElementById("result").innerHTML =
"Total Amount: ₹" + amount.toFixed(2) +
"<br>Compound Interest: ₹" + interest.toFixed(2);

}

</script>

</body>
</html>
